# Поверх docker-compose.yml: порты наружу и hot reload для разработки.
services:
  postgres:
    ports:
      - "5432:5432"

  redis:
    ports:
      - "6379:6379"

  # Локальное S3. Образ minio/minio убран с Docker Hub, поэтому chainguard-сборка (тег latest).
  # В образе нет оболочки и curl, healthcheck невозможен: minio-init сам ждёт готовности.
  minio:
    image: cgr.dev/chainguard/minio:latest@sha256:dc455cdd4db6e390b1b26514f15ff37681a777bf8dab41aac445a0259f751e56
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - miniodata:/data
    restart: unless-stopped

  # Одноразово: создаёт бакет и включает анонимное чтение (так отдаются фото на лендинге).
  minio-init:
    image: cgr.dev/chainguard/minio-client:latest-dev@sha256:799f7e86017c3ee8d00f6372e1ee28dd73453f271d5b306a47af8e8a408a777a
    depends_on:
      - minio
    environment:
      S3_ACCESS_KEY: ${S3_ACCESS_KEY}
      S3_SECRET_KEY: ${S3_SECRET_KEY}
      S3_BUCKET: ${S3_BUCKET}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -e
        until mc alias set local http://minio:9000 "$$S3_ACCESS_KEY" "$$S3_SECRET_KEY"; do sleep 1; done
        mc mb --ignore-existing "local/$$S3_BUCKET"
        mc anonymous set download "local/$$S3_BUCKET"
    restart: "no"

  api:
    depends_on:
      minio-init:
        condition: service_completed_successfully
    ports:
      - "8000:8000"
    volumes:
      - ../backend/app:/app/app
    environment:
      # Docker Desktop на Windows не пробрасывает inotify-события из bind mount.
      WATCHFILES_FORCE_POLLING: "true"
    command:
      - uvicorn
      - app.main:create_app
      - --factory
      - --host
      - 0.0.0.0
      - --port
      - "8000"
      - --no-access-log
      - --reload
      - --reload-dir
      - /app/app

  # Hot reload у worker нет: после правки задач — `just restart worker`.
  # Next в разработке работает на хосте (`just web`), поэтому worker ходит к нему через host.docker.internal.
  worker:
    depends_on:
      minio-init:
        condition: service_completed_successfully
    volumes:
      - ../backend/app:/app/app
    environment:
      REVALIDATE_URL: http://host.docker.internal:3000/api/revalidate
    extra_hosts:
      - "host.docker.internal:host-gateway"

  # Hot reload у scheduler нет: после правки задач или расписания — `just restart scheduler`.
  scheduler:
    volumes:
      - ../backend/app:/app/app

  # В разработке frontend обычно запускается локально (`just web`);
  # контейнер — для проверки production-сборки: `just dev-full`.
  web:
    profiles: ["docker-web"]
    ports:
      - "3000:3000"

volumes:
  miniodata:
