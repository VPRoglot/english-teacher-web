# Закрепление: сторонний образ = tag@sha256, сторонний action = SHA коммита.
# Dependabot обновляет и тег, и digest. У Chainguard (бесплатный тариф) есть только latest,
# поэтому его digest обновляется вместе с самим latest.
#
# Мажорные версии Dependabot не предлагает (правило `semver-major` в каждой записи): в них
# ломающие изменения, а для postgres — ещё и несовместимый формат данных (16 → 18 без
# pg_upgrade не откроет базу). Мажорные обновления делаются вручную отдельной задачей.
version: 2
updates:
  # Backend объявлен под Python 3.12 (backend/pyproject.toml: requires-python >=3.12,<3.13), а
  # для Docker 3.12 → 3.14 — «минорное» обновление тега: образ на нём не соберётся.
  # Переход на новый Python — отдельная задача вместе с requires-python.
  - package-ecosystem: docker
    directory: /backend
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
      - dependency-name: python
        versions: [">= 3.13"]
    schedule:
      interval: weekly
    groups:
      minor-and-patch:
        update-types:
          - minor
          - patch
  - package-ecosystem: docker
    directory: /frontend
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    schedule:
      interval: weekly
    groups:
      minor-and-patch:
        update-types:
          - minor
          - patch
  - package-ecosystem: docker
    directory: /infra/nginx
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    schedule:
      interval: weekly
    groups:
      minor-and-patch:
        update-types:
          - minor
          - patch
  # postgres здесь и в infra/docker-compose.yml — один и тот же tag@digest (pg_dump должен
  # совпадать по версии с сервером). Его обновляет PR экосистемы docker-compose (/infra);
  # в этот же PR вручную переносится тот же tag@digest в FROM infra/backup/Dockerfile.
  - package-ecosystem: docker
    directory: /infra/backup
    ignore:
      - dependency-name: postgres
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    schedule:
      interval: weekly
    groups:
      minor-and-patch:
        update-types:
          - minor
          - patch
  # Образ Playwright (браузеры) и @playwright/test обязаны совпадать по версии. Образ
  # Dependabot не обновляет: его tag@digest в e2e/Dockerfile переносится вручную в PR
  # экосистемы npm (/e2e) с @playwright/test — иначе job e2e в CI падает.
  - package-ecosystem: docker
    directory: /e2e
    ignore:
      - dependency-name: "*playwright"
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    schedule:
      interval: weekly
    groups:
      minor-and-patch:
        update-types:
          - minor
          - patch
  - package-ecosystem: docker-compose
    directory: /infra
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    schedule:
      interval: weekly
    groups:
      minor-and-patch:
        update-types:
          - minor
          - patch
  - package-ecosystem: github-actions
    directory: /
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    schedule:
      interval: weekly
    groups:
      minor-and-patch:
        update-types:
          - minor
          - patch
  - package-ecosystem: uv
    directory: /backend
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    schedule:
      interval: weekly
    groups:
      minor-and-patch:
        update-types:
          - minor
          - patch
  - package-ecosystem: npm
    directory: /frontend
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    schedule:
      interval: weekly
    groups:
      minor-and-patch:
        update-types:
          - minor
          - patch
  # PR с @playwright/test дополняется вручную: тот же номер версии и новый digest образа
  # mcr.microsoft.com/playwright в e2e/Dockerfile (см. запись docker /e2e выше).
  - package-ecosystem: npm
    directory: /e2e
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    schedule:
      interval: weekly
    groups:
      minor-and-patch:
        update-types:
          - minor
          - patch
