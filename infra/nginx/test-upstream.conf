# Заглушка api (:8000) и web (:3000) для infra/nginx/test.sh.
# Отвечает заголовками, которые nginx передал наверх: XFF|proto|request id|host.
server {
    listen 8000;
    listen 3000;
    client_max_body_size 0;
    default_type text/plain;

    # nginx под тестом должен скрыть этот заголовок и отдать свой X-Request-ID.
    add_header X-Request-ID stub-id always;
    add_header X-Upstream-Port $server_port always;

    # MEDIA_UPSTREAM в тесте — http://web:3000/bucket.
    location /bucket/ {
        return 200 "media|$request_uri|$host|$http_cookie\n";
    }

    location / {
        return 200 "$http_x_forwarded_for|$http_x_forwarded_proto|$http_x_request_id|$host\n";
    }
}
