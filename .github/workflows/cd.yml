name: CD

# После зелёного CI на main: сборка и публикация четырёх образов в GHCR, затем деплой по SSH.
# Вручную: workflow_dispatch с полным sha коммита (пересборка и деплой именно его).
#
# Нужны (Settings → Secrets and variables → Actions; документируются в infra/README.md):
#   secrets: DEPLOY_HOST, DEPLOY_USER, DEPLOY_SSH_KEY, DEPLOY_KNOWN_HOSTS, DEPLOY_PATH
#   vars:    SENTRY_DSN_WEB (необязателен; встраивается в сборку frontend)
#   environment: production (здесь можно включить ручное подтверждение деплоя)
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      sha:
        description: "Полный sha коммита (40 символов 0-9a-f) для сборки и деплоя"
        required: true
        type: string

permissions:
  contents: read

# Деплои идут строго по очереди и не прерываются на полпути.
concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  prepare:
    # workflow_run: только успешный CI по push (не по pull_request из форка с веткой main).
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      sha: ${{ steps.vars.outputs.sha }}
      owner_lc: ${{ steps.vars.outputs.owner_lc }}
      stale: ${{ steps.vars.outputs.stale }}
    steps:
      - name: Resolve commit sha and lowercase owner
        id: vars
        env:
          # Недоверенные значения попадают в скрипт только через env, не через ${{ }} в run.
          EVENT_NAME: ${{ github.event_name }}
          RUN_HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          INPUT_SHA: ${{ inputs.sha }}
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            sha="$INPUT_SHA"
          else
            # Коммит, прошедший CI, а не github.sha события workflow_run (это последний коммит main).
            sha="$RUN_HEAD_SHA"
          fi
          if ! [[ "$sha" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::sha должен состоять из 40 символов 0-9a-f"
            exit 1
          fi
          stale=false
          if [ "$EVENT_NAME" = "workflow_run" ]; then
            # CI старого коммита мог закончиться позже CI нового (или очередь deploy отдала ему
            # ход позже): такой прогон не должен откатить сервер на прежний релиз. Деплоится
            # только текущая вершина main; workflow_dispatch (ручной откат) не ограничен.
            main_sha="$(gh api "repos/$GITHUB_REPOSITORY/commits/main" --jq .sha)"
            if [ "$sha" != "$main_sha" ]; then
              echo "::notice::$sha уже не вершина main ($main_sha) — сборка и деплой пропущены"
              stale=true
            fi
          fi
          {
            echo "sha=$sha"
            echo "owner_lc=${GITHUB_REPOSITORY_OWNER,,}"
            echo "stale=$stale"
          } >> "$GITHUB_OUTPUT"

  images:
    needs: prepare
    # Пропуск images пропускает и deploy (он зависит от images).
    if: needs.prepare.outputs.stale != 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: true
      matrix:
        include:
          - image: backend
            context: backend
            build_args: ""
          - image: frontend
            context: frontend
            # NEXT_PUBLIC_* Next встраивает в бандл при сборке, поэтому DSN нужен именно здесь.
            build_args: |
              NEXT_PUBLIC_SENTRY_DSN=${{ vars.SENTRY_DSN_WEB }}
              NEXT_PUBLIC_SENTRY_RELEASE=sha-${{ needs.prepare.outputs.sha }}
              NEXT_PUBLIC_SENTRY_ENVIRONMENT=prod
          - image: nginx
            context: infra/nginx
            build_args: ""
          - image: backup
            context: infra/backup
            build_args: ""
          # MinIO и mc — образы Chainguard, переложенные в GHCR: cgr.dev недоступен с сервера.
          - image: minio
            context: infra/minio/server
            build_args: ""
          - image: minio-client
            context: infra/minio/client
            build_args: ""
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.sha }}
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ matrix.context }}
          push: true
          tags: |
            ghcr.io/${{ needs.prepare.outputs.owner_lc }}/english-tutor-${{ matrix.image }}:sha-${{ needs.prepare.outputs.sha }}
            ghcr.io/${{ needs.prepare.outputs.owner_lc }}/english-tutor-${{ matrix.image }}:latest
          build-args: ${{ matrix.build_args }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ needs.prepare.outputs.sha }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}
          provenance: true

  deploy:
    needs: [prepare, images]
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
    env:
      SHA: ${{ needs.prepare.outputs.sha }}
      DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
      DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
      DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
    steps:
      - name: Install SSH key and known_hosts
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          umask 077
          mkdir -p ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy_key
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/deploy_key ~/.ssh/known_hosts

      - name: Run deploy.sh on the server
        run: |
          # Скрипт идёт в stdin удалённого `bash -s` (bash на сервере точно есть, login-шелл
          # пользователя может быть любым), путь и sha — его позиционными аргументами. ssh склеивает
          # аргументы в одну строку для login-шелла сервера, поэтому путь с пробелами или
          # спецсимволами сломался бы: DEPLOY_PATH ограничен безопасными символами.
          if ! [[ "$DEPLOY_PATH" =~ ^/[A-Za-z0-9._/-]+$ ]]; then
            echo "::error::DEPLOY_PATH должен быть абсолютным путём из символов A-Za-z0-9._/-"
            exit 2
          fi
          # На сервере deploy.sh запускается отвязанным от ssh (setsid nohup) с выводом в отдельный
          # журнал $DEPLOY_PATH/deploy-logs/<время>-<sha>.log; tail --pid показывает его здесь.
          # Обрыв ssh не прерывает деплой (он дойдёт до конца или до отката сам), а wait возвращает
          # настоящий код deploy.sh: 0 — успех, 1 — откат выполнен, 2 — ошибка аргументов,
          # блокировка или неудачный откат. </dev/null у deploy.sh: иначе он (или docker compose)
          # прочитает остаток скрипта из stdin.
          set +e
          ssh -i ~/.ssh/deploy_key \
            -o IdentitiesOnly=yes \
            -o BatchMode=yes \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$HOME/.ssh/known_hosts" \
            -o ServerAliveInterval=30 \
            -o ServerAliveCountMax=10 \
            "$DEPLOY_USER@$DEPLOY_HOST" bash -s -- "$DEPLOY_PATH" "$SHA" <<'REMOTE'
          set -u
          mkdir -p "$1/deploy-logs"
          log="$1/deploy-logs/$(date -u +%Y%m%dT%H%M%SZ)-$2.log"
          : >"$log"
          setsid -w nohup "$1/infra/scripts/deploy.sh" "$2" </dev/null >"$log" 2>&1 &
          pid=$!
          tail -n +1 -f --pid="$pid" "$log" &
          tailpid=$!
          rc=0
          wait "$pid" || rc=$?
          wait "$tailpid"
          echo "Журнал на сервере: $log"
          exit "$rc"
          REMOTE
          rc=$?
          set -e
          case "$rc" in
            0) echo "Деплой $SHA выполнен" ;;
            1) echo "::error::Релиз не прошёл smoke-проверку, выполнен откат на прежнюю версию" ;;
            2) echo "::error::deploy.sh отказался работать (аргументы, блокировка или неудачный откат)" ;;
            255) echo "::error::Соединение SSH оборвалось или не установилось; если деплой успел начаться, он продолжается на сервере — смотрите $DEPLOY_PATH/deploy-logs/" ;;
            *) echo "::error::deploy.sh завершился с кодом $rc" ;;
          esac
          exit "$rc"

      - name: Remove SSH key
        if: always()
        run: rm -f ~/.ssh/deploy_key ~/.ssh/known_hosts
