# Окружение для infra/minio/test.sh (compose-проект minio-test).
# Только тестовые учётные данные; наружу ничего не публикуется.
name: minio-test

services:
  minio:
    image: cgr.dev/chainguard/minio:latest@sha256:dc455cdd4db6e390b1b26514f15ff37681a777bf8dab41aac445a0259f751e56
    command: ["server", "/data"]
    environment:
      MINIO_ROOT_USER: test-root
      MINIO_ROOT_PASSWORD: test-root-secret
    volumes:
      - miniodata:/data

  # Тот же образ и тот же способ запуска init.sh, что в prod-оверлее.
  # Значения S3_* тест передаёт при каждом `run` (-e), чтобы проверить смену пароля.
  minio-init:
    image: cgr.dev/chainguard/minio-client:latest-dev@sha256:799f7e86017c3ee8d00f6372e1ee28dd73453f271d5b306a47af8e8a408a777a
    entrypoint: ["/bin/sh", "/init.sh"]
    volumes:
      - ./init.sh:/init.sh:ro
    environment:
      MINIO_ROOT_USER: test-root
      MINIO_ROOT_PASSWORD: test-root-secret
      S3_BUCKET: media
    depends_on:
      - minio
    restart: "no"

  # Клиент для проверок: mc под разными учётками.
  mc:
    image: cgr.dev/chainguard/minio-client:latest-dev@sha256:799f7e86017c3ee8d00f6372e1ee28dd73453f271d5b306a47af8e8a408a777a
    entrypoint: ["/bin/sh", "-c", "trap exit TERM; while :; do sleep 3600 & wait $$!; done"]
    depends_on:
      - minio

  # Анонимный HTTP-клиент: в образе mc нет curl.
  curl:
    image: curlimages/curl:8.17.0@sha256:935d9100e9ba842cdb060de42472c7ca90cfe9a7c96e4dacb55e79e560b3ff40
    entrypoint: ["/bin/sh", "-c", "trap exit TERM; while :; do sleep 3600 & wait $$!; done"]

volumes:
  miniodata:
