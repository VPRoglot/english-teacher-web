# Поверх docker-compose.yml: порты наружу и hot reload для разработки.
services:
  postgres:
    ports:
      - "5432:5432"

  redis:
    ports:
      - "6379:6379"

  api:
    ports:
      - "8000:8000"
    volumes:
      - ../backend/app:/app/app
    environment:
      # Docker Desktop на Windows не пробрасывает inotify-события из bind mount.
      WATCHFILES_FORCE_POLLING: "true"
    command:
      - uvicorn
      - app.main:create_app
      - --factory
      - --host
      - 0.0.0.0
      - --port
      - "8000"
      - --no-access-log
      - --reload
      - --reload-dir
      - /app/app

  # Hot reload у worker нет: после правки задач — `just restart worker`.
  # Next в разработке работает на хосте (`just web`), поэтому worker ходит к нему через host.docker.internal.
  worker:
    volumes:
      - ../backend/app:/app/app
    environment:
      REVALIDATE_URL: http://host.docker.internal:3000/api/revalidate
    extra_hosts:
      - "host.docker.internal:host-gateway"

  # В разработке frontend обычно запускается локально (`just web`);
  # контейнер — для проверки production-сборки: `just dev-full`.
  web:
    profiles: ["docker-web"]
    ports:
      - "3000:3000"
