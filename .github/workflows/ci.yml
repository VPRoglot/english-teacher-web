name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
        with:
          version: "0.13.0"
          enable-cache: true
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy
      # testcontainers поднимает PostgreSQL и Redis через Docker раннера
      - run: uv run pytest

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
        with:
          package_json_file: frontend/package.json
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build

  # Типы сценариев Playwright: job e2e запускает их без tsc, ошибки типов он бы не заметил.
  e2e-typecheck:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: e2e
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
        with:
          package_json_file: e2e/package.json
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: e2e/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck

  api-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
        with:
          version: "0.13.0"
          enable-cache: true
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
        with:
          package_json_file: frontend/package.json
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - run: uv --directory backend sync --frozen
      - run: pnpm --dir frontend install --frozen-lockfile
      - run: uv --directory backend run python -m app.cli export-openapi ../frontend/openapi.json
      - run: pnpm --dir frontend gen:api
      - name: Generated API client is up to date
        run: test -z "$(git status --porcelain -- frontend/openapi.json frontend/src/api/generated)"

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: docker build -t english-tutor-backend:ci backend
      - run: docker build -t english-tutor-frontend:ci frontend

  nginx:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Собирает образ nginx и проверяет его на заглушках api/web (infra/nginx/test.sh)
      - run: bash infra/nginx/test.sh

  backup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Бэкап в MinIO, ротация 14/6, восстановление зашифрованного дампа в пустую базу (infra/backup/test.sh)
      - run: bash infra/backup/test.sh

  deploy-script:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # deploy.sh на заглушках docker/git/curl: успех, откат после smoke, ошибки pull/migrate,
      # неверные аргументы и .env, параллельный деплой (настоящий flock)
      - run: bash infra/scripts/test-deploy.sh
      # base-compose читает env_file ../.env — в CI его нет, берём пример prod-окружения
      - run: cp infra/prod.env.example .env
      - run: docker compose --env-file infra/prod.env.example -f infra/docker-compose.yml -f infra/docker-compose.prod.yml config -q
      # migrate вне графа `up`: иначе откат запустил бы старый migrate против новой схемы
      - name: migrate is not part of prod `up`
        run: |
          services="$(docker compose --env-file infra/prod.env.example -f infra/docker-compose.yml -f infra/docker-compose.prod.yml config --services)"
          echo "$services"
          ! grep -qx migrate <<<"$services"

  # Playwright на production-подобном стеке (nginx + TLS на tutor.test); команды — как в `just e2e`.
  # Корневой .env не нужен: e2e-оверлей берёт окружение только из infra/e2e.env.
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build images
        run: docker compose -p english-tutor-e2e --env-file infra/e2e.env -f infra/docker-compose.yml -f infra/docker-compose.prod.yml -f infra/docker-compose.e2e.yml --profile e2e build
      - name: Migrate
        run: docker compose -p english-tutor-e2e --env-file infra/e2e.env -f infra/docker-compose.yml -f infra/docker-compose.prod.yml -f infra/docker-compose.e2e.yml run --rm migrate
      - name: Start stack
        run: docker compose -p english-tutor-e2e --env-file infra/e2e.env -f infra/docker-compose.yml -f infra/docker-compose.prod.yml -f infra/docker-compose.e2e.yml up -d --wait
      - name: Create tutor
        run: docker compose -p english-tutor-e2e --env-file infra/e2e.env -f infra/docker-compose.yml -f infra/docker-compose.prod.yml -f infra/docker-compose.e2e.yml exec -T api sh /e2e/create-tutor.sh
      - name: Playwright
        run: docker compose -p english-tutor-e2e --env-file infra/e2e.env -f infra/docker-compose.yml -f infra/docker-compose.prod.yml -f infra/docker-compose.e2e.yml --profile e2e run --rm e2e
      # В RUNNER_TEMP, а не в e2e/test-results: тот каталог создаёт контейнер e2e (root),
      # раннер может не иметь права писать в него.
      - name: Stack logs
        if: failure()
        run: docker compose -p english-tutor-e2e --env-file infra/e2e.env -f infra/docker-compose.yml -f infra/docker-compose.prod.yml -f infra/docker-compose.e2e.yml logs --no-color > "$RUNNER_TEMP/stack.log" 2>&1 || true
      # Трассы, скриншоты и HTML-отчёт Playwright (спека 8.2 п.3) и логи стека.
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: failure()
        with:
          name: e2e-test-results
          path: |
            e2e/test-results
            ${{ runner.temp }}/stack.log
          retention-days: 14
      - name: Stop stack
        if: always()
        run: docker compose -p english-tutor-e2e --env-file infra/e2e.env -f infra/docker-compose.yml -f infra/docker-compose.prod.yml -f infra/docker-compose.e2e.yml --profile e2e down -v --remove-orphans

  actionlint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Проверка workflow-файлов (включая shellcheck для run-скриптов)
      - run: docker run --rm -v "$PWD:/repo" -w /repo rhysd/actionlint:1.7.12@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667 -color
