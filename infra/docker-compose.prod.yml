# Поверх docker-compose.yml на сервере: образы из реестра, nginx + certbot, MinIO для фото,
# контейнер backup, ограничения ресурсов, json-логи с ротацией. Наружу открыты только 80 и 443 (nginx).
#
#   docker compose --env-file .env -f infra/docker-compose.yml -f infra/docker-compose.prod.yml …
#
# Образы не собираются на сервере: `build` у backend/web сброшен (`!reset`, compose ≥ 2.24.4),
# поэтому неудачный pull — это ошибка, а не тихая локальная сборка. Деплой — infra/scripts/deploy.sh.

x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

x-backend-prod: &backend-prod
  image: ${IMAGE_REGISTRY:?IMAGE_REGISTRY is required}/english-tutor-backend:${IMAGE_TAG:?IMAGE_TAG is required}
  logging: *logging
  restart: unless-stopped

# Окружение всех backend-сервисов. Корневой .env подключается к ним целиком (env_file в базовом
# файле), поэтому root-учётку MinIO явно обнуляем: приложению она не нужна, оно работает
# под своим пользователем S3_ACCESS_KEY (infra/minio/init.sh).
x-backend-env: &backend-env
  APP_ENV: prod
  LOG_JSON: "true"
  MINIO_ROOT_USER: ""
  MINIO_ROOT_PASSWORD: ""

services:
  postgres:
    # postgres тоже получает .env целиком (env_file в базовом файле): root-учётка MinIO ему не нужна.
    environment:
      MINIO_ROOT_USER: ""
      MINIO_ROOT_PASSWORD: ""
    logging: *logging
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 1g

  redis:
    # AOF: очередь задач и сессии переживают перезапуск контейнера.
    command: ["redis-server", "--appendonly", "yes"]
    logging: *logging
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 256m

  migrate:
    <<: *backend-prod
    build: !reset null
    environment:
      <<: *backend-env
    # Одноразовый и вне графа `up`: deploy.sh запускает `run --rm migrate` до `up`
    # (сервис, названный явно, запускается и с профилем). Если бы api/worker/scheduler зависели
    # от migrate, откат (`up -d` на прежнем образе) запустил бы старый migrate против базы,
    # уже обновлённой новым релизом: alembic не знает новой ревизии → migrate падает → старые
    # api/worker/scheduler не стартуют. Миграции только расширяющие (схема при откате остаётся
    # новой, старый код с ней совместим), поэтому старому релизу migrate не нужен.
    profiles: ["migrate"]
    restart: "no"

  api:
    <<: *backend-prod
    build: !reset null
    # Без migrate (см. выше): только готовность postgres и redis.
    depends_on: !override
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      # Бакет медиа и пользователь приложения в MinIO готовы (infra/minio/init.sh).
      # worker и scheduler в S3 не ходят — им эта зависимость не нужна.
      minio-init:
        condition: service_completed_successfully
    environment:
      <<: *backend-env
      # Хранилище медиа — MinIO на этом же сервере (сервис minio ниже).
      S3_ENDPOINT_URL: http://minio:9000
      S3_ADDRESSING_STYLE: path
      # Порт api не опубликован, до него доходит только nginx, а nginx перезаписывает
      # X-Forwarded-For адресом клиента — поэтому доверять любому прокси безопасно.
      FORWARDED_ALLOW_IPS: "*"
    deploy:
      resources:
        limits:
          memory: 512m

  worker:
    <<: *backend-prod
    build: !reset null
    # Без migrate (см. выше): только готовность postgres и redis.
    depends_on: !override
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      <<: *backend-env
    deploy:
      resources:
        limits:
          memory: 384m

  scheduler:
    <<: *backend-prod
    build: !reset null
    # Без migrate (см. выше): только готовность postgres и redis.
    depends_on: !override
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      <<: *backend-env
    deploy:
      resources:
        limits:
          memory: 192m

  web:
    image: ${IMAGE_REGISTRY:?IMAGE_REGISTRY is required}/english-tutor-frontend:${IMAGE_TAG:?IMAGE_TAG is required}
    build: !reset null
    environment:
      SENTRY_ENVIRONMENT: prod  # как APP_ENV у api/worker/scheduler
    logging: *logging
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 512m

  # Единственный сервис с опубликованными портами. Пока certbot не выпустил сертификат,
  # nginx работает на self-signed (select-cert) и отдаёт /.well-known/acme-challenge/.
  nginx:
    image: ${IMAGE_REGISTRY:?IMAGE_REGISTRY is required}/english-tutor-nginx:${IMAGE_TAG:?IMAGE_TAG is required}
    ports:
      - "80:80"
      - "443:443"
    environment:
      SERVER_NAME: ${DOMAIN:?DOMAIN is required}
      # /media/ — прямо из бакета во внутреннем MinIO (анонимное чтение объектов).
      MEDIA_UPSTREAM: http://minio:9000/${S3_BUCKET:?S3_BUCKET is required}
      MEDIA_UPSTREAM_HOST: minio:9000
    volumes:
      - letsencrypt:/etc/letsencrypt
      - certbot-webroot:/var/www/certbot
    depends_on:
      api:
        condition: service_healthy
      web:
        condition: service_healthy
    logging: *logging
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 128m

  # Продление сертификата раз в 12 часов (certbot сам решает, пора ли). nginx подхватывает
  # новый сертификат своим циклом select-cert (раз в 6 часов). Первый выпуск — вручную:
  #   docker compose … run --rm --entrypoint sh certbot -c 'certbot certonly --webroot \
  #     -w /var/www/certbot -d "$DOMAIN" --email "$LETSENCRYPT_EMAIL" --agree-tos --no-eff-email'
  # (одинарные кавычки обязательны: DOMAIN и LETSENCRYPT_EMAIL раскрывает оболочка контейнера,
  # где они заданы в environment, а не оболочка хоста).
  certbot:
    image: certbot/certbot:v5.8.0@sha256:f70ad0adbb7e117f0fe42a63c553f28ea451edabc0148757b6efcd9735acaa20
    entrypoint:
      - /bin/sh
      - -c
      - |
        trap exit TERM
        while :; do
          certbot renew --webroot -w /var/www/certbot --quiet
          sleep 12h & wait $$!
        done
    environment:
      DOMAIN: ${DOMAIN:?DOMAIN is required}
      LETSENCRYPT_EMAIL: ${LETSENCRYPT_EMAIL:?LETSENCRYPT_EMAIL is required}
    volumes:
      - letsencrypt:/etc/letsencrypt
      - certbot-webroot:/var/www/certbot
    logging: *logging
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 128m

  # Хранилище фото лендинга на этом же сервере. Наружу не публикуется: загрузки идут от api,
  # отдача — через nginx (/media/). Данные — в томе miniodata.
  # В chainguard-образе нет оболочки, healthcheck невозможен: готовности ждёт minio-init.
  minio:
    # Образ из нашего GHCR (infra/minio/server/Dockerfile): cgr.dev с сервера недоступен.
    image: ${IMAGE_REGISTRY:?IMAGE_REGISTRY is required}/english-tutor-minio:${IMAGE_TAG:?IMAGE_TAG is required}
    command: ["server", "/data"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?MINIO_ROOT_USER is required}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD is required}
    volumes:
      - miniodata:/data
    logging: *logging
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 512m

  # Одноразово при каждом `up`: бакет, анонимное чтение, пользователь приложения и его политика
  # (infra/minio/init.sh; повторный запуск безопасен, смена S3_SECRET_KEY применяется здесь).
  # Root-учётку MinIO получают только minio и minio-init.
  minio-init:
    # Образ из нашего GHCR (infra/minio/client/Dockerfile): cgr.dev с сервера недоступен.
    image: ${IMAGE_REGISTRY:?IMAGE_REGISTRY is required}/english-tutor-minio-client:${IMAGE_TAG:?IMAGE_TAG is required}
    entrypoint: ["/bin/sh", "/init.sh"]
    volumes:
      - ./minio/init.sh:/init.sh:ro
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?MINIO_ROOT_USER is required}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD is required}
      S3_BUCKET: ${S3_BUCKET:?S3_BUCKET is required}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:?S3_ACCESS_KEY is required}
      S3_SECRET_KEY: ${S3_SECRET_KEY:?S3_SECRET_KEY is required}
    depends_on:
      - minio
    logging: *logging
    restart: "no"

  # Ежедневный зашифрованный pg_dump в S3 (infra/backup). В MVP выключен: сервис в профиле
  # `backup`, обычный `up` и deploy.sh его не запускают. Включение — infra/README.md, «Бэкапы».
  # Переменные BACKUP_* здесь необязательны (`:-`): compose интерполирует весь файл даже при
  # выключенном профиле, а `:?` уронил бы `up` на сервере без бэкапов. Проверяет их сам
  # backup.sh при каждом запуске — пустое значение для него ошибка.
  # Получает только нужные переменные: PG* выводятся из POSTGRES_* в .env, остальные секреты
  # backend сюда не попадают.
  backup:
    image: ${IMAGE_REGISTRY:?IMAGE_REGISTRY is required}/english-tutor-backup:${IMAGE_TAG:?IMAGE_TAG is required}
    profiles: ["backup"]
    environment:
      PGHOST: postgres
      PGUSER: ${POSTGRES_USER:?POSTGRES_USER is required}
      PGPASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      PGDATABASE: ${POSTGRES_DB:?POSTGRES_DB is required}
      BACKUP_S3_BUCKET: ${BACKUP_S3_BUCKET:-}
      BACKUP_S3_ENDPOINT_URL: ${BACKUP_S3_ENDPOINT_URL:-}
      BACKUP_S3_REGION: ${BACKUP_S3_REGION:-}
      BACKUP_S3_ACCESS_KEY: ${BACKUP_S3_ACCESS_KEY:-}
      BACKUP_S3_SECRET_KEY: ${BACKUP_S3_SECRET_KEY:-}
      BACKUP_AGE_RECIPIENT: ${BACKUP_AGE_RECIPIENT:-}
      S3_BUCKET: ${S3_BUCKET:?S3_BUCKET is required}
      HEARTBEAT_BACKUP_URL: ${HEARTBEAT_BACKUP_URL:-}
    depends_on:
      postgres:
        condition: service_healthy
    logging: *logging
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 256m

volumes:
  letsencrypt:
  certbot-webroot:
  miniodata:
