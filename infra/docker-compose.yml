name: english-tutor

x-backend: &backend
  image: english-tutor-backend:${IMAGE_TAG:-dev}
  build:
    context: ../backend
  env_file: ../.env

services:
  postgres:
    image: postgres:16-alpine@sha256:721873c34ceb9f8d8fc265984940dc982404c105f19ad51be9fdc5970a6080ea
    env_file: ../.env
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      # -h 127.0.0.1: проверяем TCP — unix-сокет отвечает ещё во время init-сервера образа.
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:8-alpine@sha256:3811787313eba226a2ef38658c6ccb91cd5e110edc89c37767de373120a0e5a0
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  migrate:
    <<: *backend
    command: ["alembic", "upgrade", "head"]
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  api:
    <<: *backend
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')"
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  worker:
    <<: *backend
    command: ["taskiq", "worker", "app.worker:broker", "--workers", "1"]
    environment:
      REVALIDATE_URL: http://web:3000/api/revalidate
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    restart: unless-stopped

  # Планировщик задач по расписанию (ежедневная материализация серий занятий).
  # Ровно один экземпляр: второй поставил бы каждую задачу в очередь дважды.
  scheduler:
    <<: *backend
    command: ["taskiq", "scheduler", "app.scheduler:scheduler"]
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    restart: unless-stopped

  web:
    image: english-tutor-frontend:${IMAGE_TAG:-dev}
    build:
      context: ../frontend
    # Без env_file: web не должен получать секреты backend (DATABASE_URL, пароли, ключи S3).
    # Значения подставляет compose из .env (`--env-file .env`).
    environment:
      API_INTERNAL_URL: http://api:8000
      SITE_URL: ${SITE_URL}
      REVALIDATE_SECRET: ${REVALIDATE_SECRET}
      # Клиентский ключ SmartCaptcha необязателен: без него форма заявки работает без капчи.
      SMARTCAPTCHA_CLIENT_KEY: ${SMARTCAPTCHA_CLIENT_KEY:-}
      # Серверный Sentry web (отдельный проект от backend); пусто — отключён.
      # Браузерный DSN встраивается при сборке (NEXT_PUBLIC_SENTRY_DSN, build arg).
      SENTRY_DSN: ${SENTRY_DSN_WEB:-}
      SENTRY_RELEASE: ${IMAGE_TAG:-}
      # То же окружение событий, что у backend (APP_ENV); prod и e2e задают его явно.
      SENTRY_ENVIRONMENT: ${APP_ENV:-dev}
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/ >/dev/null || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
    restart: unless-stopped

volumes:
  pgdata:
  redisdata:
